name: build and publish a release

on:
  release:
    types: [published]

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: KodeinKoders/kodein-github-actions/gradle-kotlin-setup@v0.4
        with:
          konan: 'false' # JVM only
      - name: Check version
        uses: KodeinKoders/kodein-github-actions/version-check@v0.4
        with:
          release-name: ${{ github.event.release.name }}
      - name: Build
        run: ./gradlew --stacktrace --scan build
        shell: bash
      - name: Publish
        uses: KodeinKoders/kodein-github-actions/publish@v0.4
        with:
          central-portal-token-username: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          central-portal-token-password: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          pgp-signing-key: ${{ secrets.PGP_SIGNING_KEY }}
          pgp-signing-password: ${{ secrets.PGP_SIGNING_PASSWORD }}

  # Its own job, so that the write permission is confined to it.
  release-branch:
    needs: [build-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release branch
        uses: KodeinKoders/kodein-github-actions/release-branches@v0.4
        with:
          release-name: ${{ github.event.release.name }}
          skip-release-prefix: true

  # The site is built from the release branches, so it is rebuilt once they are updated.
  # The workflow is in this repository, so the workflow's own token can run it.
  build-documentation:
    needs: [release-branch]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger the documentation build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo ${{ github.repository }}
        shell: bash
